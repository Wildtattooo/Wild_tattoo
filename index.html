<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WILD. — Studio & Digital</title>
  <meta name="description" content="Tatuamos ideias. Criamos identidades. Construímos experiências digitais. Escolhe a tua experiência.">
  
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="stylesheet" href="style.css">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0b0b0c;
      color: #fff;
      overflow-x: hidden;
    }
    .split-hero {
      display: flex;
      min-height: 100vh;
      width: 100vw;
      position: relative;
    }
    .split-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 3rem 2rem;
      position: relative;
      text-decoration: none;
      color: #fff;
      overflow: hidden;
      transition: flex 0.5s ease;
    }
    .panel-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: grayscale(80%) brightness(0.35);
      transition: filter 0.5s ease, transform 0.6s ease;
      z-index: 1;
    }
    .panel-tattoo .panel-bg {
      background-image: url('TATTOO01.jpeg');
    }
    .panel-design .panel-bg {
      background-image: url('logo.jpg');
    }
    .panel-content {
      position: relative;
      z-index: 2;
      max-width: 440px;
    }
    .panel-tag {
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e5ff00;
      display: block;
      margin-bottom: 0.75rem;
    }
    .split-panel h2 {
      font-size: 3rem;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    .split-panel p {
      color: #aaa;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .split-btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      border: 1px solid #fff;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: #fff;
      transition: all 0.3s ease;
    }
    .panel-tattoo .split-btn {
      background: #e5ff00;
      border-color: #e5ff00;
      color: #000;
    }
    .panel-tattoo .split-btn:hover {
      background: #fff;
      border-color: #fff;
    }
    .panel-design .split-btn:hover {
      background: #fff;
      color: #000;
    }
    .center-logo {
      position: absolute;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.5rem 1.2rem;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      pointer-events: none;
    }
    .center-logo img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }
    .center-logo span {
      font-weight: 700;
      letter-spacing: 1px;
    }
    .center-logo span span {
      color: #e5ff00;
    }

    @media (min-width: 992px) {
      .split-panel:hover {
        flex: 1.35;
      }
      .split-panel:hover .panel-bg {
        filter: grayscale(10%) brightness(0.6);
        transform: scale(1.05);
      }
    }
    @media (max-width: 991px) {
      .split-hero {
        flex-direction: column;
      }
      .split-panel {
        min-height: 50vh;
      }
      .center-logo {
        top: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="center-logo">
    <img src="logo.jpg" alt="Logo">
    <span>WILD<span>.</span></span>
  </div>

  <main class="split-hero">
    <a href="tattoo.html" class="split-panel panel-tattoo">
      <div class="panel-bg"></div>
      <div class="panel-content">
        <span class="panel-tag">Studio &amp; Pele</span>
        <h2>WILD<br>TATTOO</h2>
        <p>Projetos exclusivos, traços finos e arte autoral que não passa despercebida.</p>
        <span class="split-btn">Entrar no Studio ↗</span>
      </div>
    </a>

    <a href="design-web.html" class="split-panel panel-design">
      <div class="panel-bg"></div>
      <div class="panel-content">
        <span class="panel-tag">Digital &amp; Branding</span>
        <h2>DESIGN<br>&amp; WEB</h2>
        <p>Identidades marcantes, materiais visuais e experiências digitais feitas à medida.</p>
        <span class="split-btn">Ver Projetos ↗</span>
      </div>
    </a>
  </main>

</body>
</html>
