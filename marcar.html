<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento | Calendário</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #181818;
      --accent: #ffd700;
      --accent-hover: #e6c200;
      --text: #ffffff;
      --text-dim: #a0a0a0;
      --border: #2a2a2a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .container { background: var(--card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 440px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    h2 { color: var(--accent); text-align: center; text-transform: uppercase; font-size: 1.3rem; letter-spacing: 1px; margin-bottom: 6px; }
    .subtitle { text-align: center; color: var(--text-dim); font-size: 0.85rem; margin-bottom: 20px; }
    
    /* Calendário */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .calendar-header span { font-weight: bold; font-size: 1.05rem; }
    .calendar-header button { background: #252525; border: 1px solid var(--border); color: #fff; border-radius: 6px; width: 32px; height: 32px; cursor: pointer; }
    .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; color: var(--text-dim); font-weight: bold; margin-bottom: 6px; }
    .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; border-radius: 6px; cursor: pointer; border: 1px solid transparent; background: #222; }
    .day.disabled { color: #444; background: transparent; cursor: not-allowed; }
    .day:not(.disabled):hover { background: #333; border-color: var(--accent); }
    .day.selected { background: var(--accent) !important; color: #000 !important; font-weight: bold; }

    /* Horários */
    .section-title { font-size: 0.85rem; font-weight: 600; color: var(--text-dim); margin: 18px 0 8px; }
    .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .slot { padding: 10px; background: #222; border: 1px solid var(--border); border-radius: 6px; text-align: center; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
    .slot:hover { border-color: var(--accent); }
    .slot.selected { background: var(--accent); color: #000; font-weight: bold; }

    /* Formulário */
    .input-group { margin-top: 14px; }
    label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px; }
    input { width: 100%; padding: 11px; background: #222; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus { border-color: var(--accent); }
    .btn-submit { width: 100%; background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 13px; font-weight: bold; font-size: 0.95rem; text-transform: uppercase; cursor: pointer; margin-top: 18px; transition: 0.2s; }
    .btn-submit:hover { background: var(--accent-hover); }
    .terms { font-size: 0.75rem; color: #777; text-align: center; margin-top: 12px; line-height: 1.3; }
  </style>
</head>
<body>

<div class="container">
  <h2>Agendamento Online</h2>
  <p class="subtitle">Escolhe a data e horário para a tua sessão</p>

  <div class="calendar-header">
    <button type="button" id="prevMonth">&lt;</button>
    <span id="monthYear"></span>
    <button type="button" id="nextMonth">&gt;</button>
  </div>
  
  <div class="calendar-weekdays">
    <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
  </div>
  <div class="calendar-days" id="calendarDays"></div>

  <div class="section-title">Horários Disponíveis</div>
  <div class="slots" id="slotContainer">
    <div class="slot" data-time="10:00">10:00</div>
    <div class="slot" data-time="14:00">14:00</div>
    <div class="slot" data-time="16:30">16:30</div>
    <div class="slot" data-time="18:30">18:30</div>
  </div>

  <form id="bookingForm">
    <div class="input-group">
      <label>Nome Completo</label>
      <input type="text" id="nome" required placeholder="Teu nome">
    </div>
    <div class="input-group">
      <label>Contacto WhatsApp</label>
      <input type="tel" id="telefone" required placeholder="912345678">
    </div>
    <div class="input-group">
      <label>Ideia / Zona do Corpo</label>
      <input type="text" id="ideia" required placeholder="Ex: Fine Line no braço, 10cm">
    </div>

    <button type="submit" class="btn-submit" id="btnSubmit">Reservar Vaga</button>
    <p class="terms">A vaga é guardada provisoriamente por 24 horas até validação do sinal por MB WAY.</p>
  </form>
</div>

<script>
  // COLA AQUI O TEU URL DO APPS SCRIPT E NÚMERO
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYwPBfedk6a3VSaR6O_CDQ6Ga0qH10XMa2qds_4v9IT-b7Z1mQSpA7999Dp5MgW_DC/exec"; 
  const MEU_WHATSAPP = "351912886085"; // O teu contacto de WhatsApp
  const VALOR_SINAL = "30€";

  let dataAtual = new Date();
  let selectedDate = null;
  let selectedTime = null;

  const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

  function renderCalendar() {
    const year = dataAtual.getFullYear();
    const month = dataAtual.getMonth();
    document.getElementById('monthYear').innerText = `${monthNames[month]} ${year}`;

    const firstDayIndex = new Date(year, month, 1).getDay();
    const lastDay = new Date(year, month + 1, 0).getDate();
    const daysContainer = document.getElementById('calendarDays');
    daysContainer.innerHTML = '';

    const today = new Date();
    today.setHours(0,0,0,0);

    for (let i = 0; i < firstDayIndex; i++) {
      const empty = document.createElement('div');
      daysContainer.appendChild(empty);
    }

    for (let d = 1; d <= lastDay; d++) {
      const dayEl = document.createElement('div');
      dayEl.classList.add('day');
      dayEl.innerText = d;
      
      const checkDate = new Date(year, month, d);
      if (checkDate < today || checkDate.getDay() === 0) { // Bloqueia dias passados e Domingos
        dayEl.classList.add('disabled');
      } else {
        const formattedDate = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if (selectedDate === formattedDate) dayEl.classList.add('selected');
        
        dayEl.onclick = () => {
          document.querySelectorAll('.day').forEach(el => el.classList.remove('selected'));
          dayEl.classList.add('selected');
          selectedDate = formattedDate;
        };
      }
      daysContainer.appendChild(dayEl);
    }
  }

  document.getElementById('prevMonth').onclick = () => { dataAtual.setMonth(dataAtual.getMonth() - 1); renderCalendar(); };
  document.getElementById('nextMonth').onclick = () => { dataAtual.setMonth(dataAtual.getMonth() + 1); renderCalendar(); };

  document.querySelectorAll('.slot').forEach(slot => {
    slot.onclick = () => {
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
      slot.classList.add('selected');
      selectedTime = slot.dataset.time;
    };
  });

  document.getElementById('bookingForm').onsubmit = async (e) => {
    e.preventDefault();
    if (!selectedDate) return alert("Por favor, seleciona um dia no calendário.");
    if (!selectedTime) return alert("Por favor, seleciona um horário.");

    const btn = document.getElementById('btnSubmit');
    btn.innerText = "A registar reserva...";
    btn.disabled = true;

    const nome = document.getElementById('nome').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const ideia = document.getElementById('ideia').value.trim();

    const dados = { nome, telefone, ideia, data: selectedDate, hora: selectedTime };

    // Regista na Folha e no Google Calendar
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      });
    } catch(err) {
      console.error("Erro ao registar:", err);
    }

    // Redirecionamento para o teu WhatsApp
    const partes = selectedDate.split('-');
    const dataPt = `${partes[2]}/${partes[1]}/${partes[0]}`;
    
    const msg = `Olá! Acabei de marcar no site:%0A%0A` +
      `📅 *Data:* ${dataPt}%0A` +
      `⏰ *Hora:* ${selectedTime}%0A` +
      `👤 *Nome:* ${encodeURIComponent(nome)}%0A` +
      `💉 *Ideia:* ${encodeURIComponent(ideia)}%0A%0A` +
      `Aguardo os dados para pagar o sinal (${VALOR_SINAL}) por MB WAY e confirmar a vaga.`;

    window.location.href = `https://wa.me/${MEU_WHATSAPP}?text=${msg}`;
  };

  renderCalendar();
</script>
</body>
</html>
