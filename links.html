<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WILD. — Quick Links</title>
  <meta name="description" content="Wild Studio — Tattoo, Design & Web">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0d0d0d;
      --card-bg: #141414;
      --yellow: #ffee00;
      --text: #ffffff;
      --subtext: #888888;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1.2rem 1.5rem 1.2rem;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    /* CONTAINER ESTILO SMARTPHONE */
    .mobile-wrapper {
      width: 100%;
      max-width: 390px; /* Largura ideal de ecrã de telemóvel */
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
    }

    /* 1. ANIMAÇÃO DO LOGO (GLOW & PULSE NÉON) */
    .avatar-wrapper {
      position: relative;
      margin-bottom: 1rem;
    }

    .avatar {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--yellow);
      animation: logo-glow 2.8s infinite alternate ease-in-out;
    }

    @keyframes logo-glow {
      0% {
        box-shadow: 0 0 10px rgba(255, 238, 0, 0.2), 0 0 20px rgba(255, 238, 0, 0.1);
        transform: scale(1);
      }
      100% {
        box-shadow: 0 0 25px rgba(255, 238, 0, 0.6), 0 0 40px rgba(255, 238, 0, 0.25);
        transform: scale(1.04);
      }
    }

    /* TÍTULO COM PONTO ANIMADO */
    .brand-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .brand-title span {
      color: var(--yellow);
      display: inline-block;
      animation: dot-bounce 2s infinite ease-in-out;
    }

    @keyframes dot-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .brand-tagline {
      font-size: 0.8rem;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 1.4rem;
      text-align: center;
    }

    /* BLOCO README (TERMINAL STYLE) */
    .readme-card {
      width: 100%;
      background: #111111;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 3px solid var(--yellow);
      border-radius: 8px;
      padding: 0.9rem;
      margin-bottom: 1.5rem;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #cccccc;
    }

    .readme-card header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--yellow);
      letter-spacing: 1.5px;
    }

    /* 2. LISTA DE BOTÕES ANIMADOS P/ POLEGAR */
    .links-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .btn-link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 18px;
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden;
    }

    /* Seta a deslizar ao tocar/passar o rato */
    .btn-link .btn-icon {
      transition: transform 0.25s ease;
    }

    .btn-link:active .btn-icon, .btn-link:hover .btn-icon {
      transform: translateX(4px);
    }

    .btn-link:active, .btn-link:hover {
      border-color: var(--yellow);
      background-color: #1a1a1a;
      transform: scale(0.98);
    }

    /* BOTÃO PRINCIPAL (WHATSAPP) COM PULSO DE LUZ */
    .btn-link.primary {
      background-color: var(--yellow);
      color: #0d0d0d;
      border-color: var(--yellow);
      animation: btn-pulse 2.2s infinite ease-in-out;
    }

    @keyframes btn-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 238, 0, 0.5);
      }
      70% {
        box-shadow: 0 0 0 14px rgba(255, 238, 0, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 238, 0, 0);
      }
    }

    .btn-link.primary:active {
      transform: scale(0.96);
      background-color: #ffffff;
    }

    /* RODAPÉ */
    footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.72rem;
      color: var(--subtext);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    footer a {
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }

    /* SE FOR ABERTO EM ECRÃS GRANDES (COMPUTADOR) - MANTÉM MOLDURA MOBILE */
    @media (min-width: 600px) {
      body {
        justify-content: center;
      }
      .mobile-wrapper {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 2.5rem 1.8rem;
        background: #101010;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      }
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper">
    
    <!-- Logo Animado com Halo Néon -->
    <div class="avatar-wrapper">
      <img src="logo.jpg" alt="WILD." class="avatar">
    </div>

    <h1 class="brand-title">WILD<span>.</span></h1>
    <p class="brand-tagline">Tattoo · Design · Web Studio</p>

    <!-- Bloco README -->
    <div class="readme-card">
      <header>
        <span>⚡ README.txt</span>
        <span>v2.0</span>
      </header>

      Arte autoral na pele, identidades visuais marcantes e experiências digitais únicas.
    </div>

    <!-- Lista de Botões Animados para Telemóvel -->
    <div class="links-group">
      
      <!-- WhatsApp (Pulsante) -->
      <a href="https://wa.me/351912886085" target="_blank" rel="noopener" class="btn-link primary">
        <span>💬 PEDIR ORÇAMENTO</span>
        <span class="btn-icon">→</span>
      </a>

      <!-- Portfólio Tattoo -->
      <a href="index.html#work" class="btn-link">
        <span>🖤 PORTFÓLIO TATTOO</span>
        <span class="btn-icon">↗</span>
      </a>

      <!-- Design & Web -->
      <a href="index.html#design" class="btn-link">
        <span>⚡ DESIGN & WEBSITES</span>
        <span class="btn-icon">↗</span>
      </a>

      <!-- Instagram -->
      <a href="https://instagram.com/wild.tattooo" target="_blank" rel="noopener" class="btn-link">
        <span>📸 INSTAGRAM</span>
        <span class="btn-icon">↗</span>
      </a>

      <!-- Site Oficial -->
      <a href="index.html" class="btn-link">
        <span>🌐 SITE OFICIAL</span>
        <span class="btn-icon">↗</span>
      </a>

    </div>

  </div>

  <!-- Rodapé -->
  <footer>
    <p>© 2026 <a href="index.html">WILD.</a> — Todos os direitos reservados</p>
  </footer>

</body>
</html>
